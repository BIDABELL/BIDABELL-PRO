<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14254A">
<title>BIDABELL Pro</title>
<link rel="icon" type="image/png" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>/* light / dark mode chosen with the 🌙 button, remembered on this device */
(function(){var t="";try{t=localStorage.getItem("bidabell-theme")||""}catch(e){}
if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
document.documentElement.setAttribute("data-theme",t)})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: navy top bar with section tabs; each section is a scanned control panel — filters, KPI tiles, then tables */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --sunken:#E8ECF4; --ink:#0F1B33; --muted:#5A6580; --line:#D9DFEA;
  --navy:#14254A; --navy-ink:#EEF2FA; --gold:#F28C0F; --gold-ink:#1C1404; --gold-soft:#F5E8C6;
  --good:#17784F; --good-soft:#DDF2E8; --bad:#B23A30; --bad-soft:#F8E1DE; --warn:#A86A00; --warn-soft:#FBEBCB; --info:#2D5BB9; --info-soft:#E0E8F8;
  --accent:#F28C0F; --side:#161B26;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1120; --surface:#111B31; --sunken:#0D1628; --ink:#E6EBF5; --muted:#93A0BB; --line:#223050;
  --navy:#0E1A36; --navy-ink:#E6EBF5; --gold:#F5A030; --gold-ink:#1C1404; --gold-soft:#3A2F14;
  --good:#4CC796; --good-soft:#123227; --bad:#F07F72; --bad-soft:#3A1E1B; --warn:#F0B44C; --warn-soft:#3A2C12; --info:#86A9F0; --info-soft:#18284A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#111B31; --sunken:#0D1628; --ink:#E6EBF5; --muted:#93A0BB; --line:#223050;
  --navy:#0E1A36; --navy-ink:#E6EBF5; --gold:#F5A030; --gold-ink:#1C1404; --gold-soft:#3A2F14;
  --good:#4CC796; --good-soft:#123227; --bad:#F07F72; --bad-soft:#3A1E1B; --warn:#F0B44C; --warn-soft:#3A2C12; --info:#86A9F0; --info-soft:#18284A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto}

.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;white-space:nowrap}
.brand{display:flex;align-items:center;gap:6px}.brand b{color:var(--gold)}
.login-logo{display:block;margin:0 auto 6px;max-width:220px;width:70%;height:auto}
.logo-on-dark{display:none}:root[data-theme="dark"] .logo-on-light{display:none}:root[data-theme="dark"] .logo-on-dark{display:block}

main{padding-block:18px 60px}
main .inner{display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:1.35rem;margin:0;font-weight:700;text-wrap:balance}
h2{font-family:var(--display);font-size:1rem;margin:0;font-weight:600}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:.85rem}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted)}
.field input,.field select,.inp{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;min-width:0;color:var(--ink);font-size:.9rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn{border:0;border-radius:10px;padding:9px 16px;font-family:var(--display);font-weight:600;background:var(--gold);color:var(--gold-ink)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:.78rem;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.25}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi.hero{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.kpi.hero .l,.kpi.hero .s{color:color-mix(in srgb,var(--navy-ink) 70%,transparent)}
.kpi.hero .v{color:var(--gold)}
.meter{height:5px;border-radius:9px;background:var(--sunken);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:9px}

.tw{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th{font-weight:500;color:var(--muted);font-size:.76rem;text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunken)}
/* delivered rows green, returned rows red */
tr.row-del td{background:color-mix(in srgb,var(--good) 14%,transparent)}
tr.row-ret td{background:color-mix(in srgb,var(--bad) 14%,transparent)}
tr.row-del td:first-child{box-shadow:inset -4px 0 0 var(--good)}
tr.row-ret td:first-child{box-shadow:inset -4px 0 0 var(--bad)}
tr.click.row-del:hover td{background:color-mix(in srgb,var(--good) 24%,transparent)}
tr.click.row-ret:hover td{background:color-mix(in srgb,var(--bad) 24%,transparent)}
/* number columns: header and value share one physical edge (cells with .num switch to ltr, so logical "end" would split them) */
th{text-align:right}td.num{text-align:right}
td.r,th.r{text-align:center}
.pos{color:var(--good)} .neg{color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-info{background:var(--info-soft);color:var(--info)} .p-none{background:var(--sunken);color:var(--muted)}
td select.mini{border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 4px;font-size:.8rem;max-width:150px}
td select.mini:hover{border-color:var(--line)}
.who{display:flex;flex-direction:column;min-width:0}
.who small{color:var(--muted)}
.pimg{width:42px;height:42px;object-fit:cover;border-radius:8px;background:var(--sunken);flex:none}
.pcell{display:flex;align-items:center;gap:8px}
.pimg.ph{display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.1rem}
#callDlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}#callDlg[hidden]{display:none}#callDlg .card{width:100%;max-width:520px;margin:0}
.cbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.cbar .cb{font-size:.75rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line,#ccd);text-decoration:none;color:inherit;white-space:nowrap}
.clog{display:block;margin-top:3px;font-size:.72rem;color:var(--muted);cursor:help}
.who .hist{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;cursor:help}
a.wa{color:var(--good);text-decoration:none;font-weight:600;font-size:.78rem}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li small{color:var(--muted)}
.li.total{font-weight:700;font-family:var(--display)}
button.li{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;cursor:pointer;border-radius:0;font:inherit;color:inherit}
button.li:last-child{border-bottom:0}
button.li:hover{background:var(--sunken)}
button.li.on{background:var(--gold-soft)}
.hbar{grid-column:1/-1;height:6px;background:var(--sunken);border-radius:9px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--gold);border-radius:9px}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.form .wide{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted)}
.note{font-size:.8rem;color:var(--muted)}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--navy);color:var(--navy-ink);padding:6px 10px;border-radius:8px;font-size:.8rem;white-space:nowrap;opacity:0;transition:opacity .12s}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;padding-inline:16px;z-index:20}
.toast span{background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transform:translateY(8px);transition:.2s}
.toast span.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== layout: sections in a sidebar (desktop), drawer behind ☰ (phone) ===== */
.app{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--side);color:var(--navy-ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:14px;z-index:30}
.side:has(nav[hidden]){display:none}
.side-logo{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px 12px;border-bottom:1px solid color-mix(in srgb,var(--navy-ink) 12%,transparent)}
.side-logo img{width:100%;max-width:190px;height:auto}
.side-logo small{color:var(--accent);font-weight:700;letter-spacing:.2em;font-size:.72rem}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;align-items:center;gap:12px;color:var(--navy-ink);opacity:.8;text-decoration:none;padding:11px 14px;border-radius:12px;font-weight:500;white-space:nowrap}
nav a svg{width:21px;height:21px;flex:0 0 21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a span{flex:1}
nav a:hover{opacity:1;background:color-mix(in srgb,var(--navy-ink) 8%,transparent)}
nav a[aria-current="page"]{opacity:1;background:var(--accent);color:#fff;font-weight:700;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
nav a .bd{font-style:normal;background:#E5383B;color:#fff;border-radius:999px;font-size:.72rem;font-weight:700;min-width:22px;padding:1px 7px;text-align:center}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .inner{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:1180px}
.iconbtn{padding:6px 11px!important;font-size:1rem}
#menuBtn,.top-logo,.side-dim{display:none}
.gsearch{position:relative;flex:1;max-width:520px}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 38px 9px 14px;color:var(--ink);font-size:.9rem}
.gsearch .g-ico{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.6;pointer-events:none}
.g-res{position:absolute;top:calc(100% + 6px);inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.18);max-height:70vh;overflow:auto;z-index:40;padding:6px}
.g-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-radius:10px;padding:8px 10px;color:inherit;font:inherit}
.g-row:hover{background:var(--sunken)} .g-row small{color:var(--muted)}
.g-row.row-del{background:color-mix(in srgb,var(--good) 10%,transparent)} .g-row.row-ret{background:color-mix(in srgb,var(--bad) 10%,transparent)}
.g-cli{background:var(--sunken);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.top-logo{height:30px;width:auto;background:var(--side);border-radius:8px;padding:3px 8px}
.sync{font-size:.78rem;color:var(--muted);white-space:nowrap}
@media (max-width:900px){
  .side{position:fixed;top:0;bottom:0;right:0;height:100%;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.3)}
  .app.menu-open .side{transform:none}
  .app.menu-open .side-dim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .mainwrap:has(+ *),.mainwrap{width:100%}
  body:has(nav:not([hidden])) #menuBtn,body:has(nav:not([hidden])) .top-logo{display:inline-block}
  .top .inner{gap:6px;padding-block:8px}
  #syncBtn{font-size:0!important;padding:6px 10px!important}
  #syncBtn::before{content:"🔄";font-size:1rem}
  .sync{display:none}
  .top .inner{flex-wrap:wrap}
  .gsearch{order:10;flex:0 0 100%;max-width:none}
  main{padding-block:12px 40px}
  h1{font-size:1.2rem}
  .kpi .v{font-size:1.15rem}
}
</style>
</head>
<body>

  </nav>
</aside>
<div class="side-dim" id="sideDim"></div>
<div class="mainwrap">
<header class="top gut">
  <div class="inner">
    <button class="btn sec iconbtn" id="menuBtn" type="button" aria-label="القائمة">☰</button>

<script>
/* ================= constants ================= */
const CONF=["Nouveau","Confirmé","Appel 1","Appel 2","Appel 3","Appel + Message Whatssap","Appel + Message SMS","Pas de réponse","Reporté","Injoignable","Boîte Vocal","Annulé","Pas sérieux","Fake order","Double"];
const CANCEL=new Set(["Annulé","Pas sérieux","Fake order","Double"]);
const DELIV=["","Nouveau Colis","Attente De Ramassage","Ramassé","Reçu","Expédié","Mise en distribution","Programmé","Reporté","Pas de réponse","Livré","Refusé","Demande de Retour","Retourné","Annulé"];
const RET=new Set(["Retourné","Refusé","Demande de Retour","Failed","Annulé"]);
const EXP_CATS=["إشهار Meta","شرا السلعة","كراء","تيليفون","WiFi","نقل","أدوات وتصوير","خلصة أخرى","أخرى"];
const MONTHS=["يناير","فبراير","مارس","أبريل","ماي","يونيو","يوليوز","غشت","شتنبر","أكتوبر","نونبر","دجنبر"];
const DEFAULTS={
  products:[

/* ================= server (COLIX, backup, accounts) ================= */
async function fn(action,extra){
  const {data:{session}}=await SB.auth.getSession();if(!session)throw new Error("خاصك تعاود تدخل");
  const r=await fetch(SB_URL+"/functions/v1/BIDABELL",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token,"apikey":SB_KEY},body:JSON.stringify({action,...(extra||{})})});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j;
}
let TRACKING=false;
async function trackNow(manual){
  if(TRACKING)return;TRACKING=true;const b=$("syncBtn");b.disabled=true;b.textContent="كيتحدث…";
  try{const r=await fn("track");
    if(manual)toast(r.due?`تسولو ${r.done} كولي فـ COLIX`+(r.waited?` · ${r.waited} خاصهم يتسناو (COLIX: مرة ف 3 سوايع)`:""):"كلشي محدث. كل كولي كيتسول عليه مرة ف 3 سوايع، أوتوماتيك.")}
  catch(e){if(manual)toast("ما خدمش التحديث: "+e.message)}
  finally{TRACKING=false;b.disabled=false;b.textContent="تحديث الحالات"}
}
let PUSHING=false;
function outboxCandidates(){return allOrders().filter(o=>o.cs==="Confirmé"&&!o.t&&!o.sent&&!o.cxErr&&!o.imp&&fresh(o.d))}
async function pushOutbox(manual){
  if(!ISOWNER||PUSHING)return;
  const list=outboxCandidates();if(!list.length){if(manual)toast("ما كاين حتى طلبية مأكدة باقي ما تصيفطاتش");return}
  PUSHING=true;
  try{
    /* save first: the server reads the orders from the database */
    await Promise.all([...new Set(list.map(o=>o.d.slice(0,7)))].map(m=>writeOrders(m)));
    const r=await fn("send");const res=r.results||[];
    UI.ord.sentRes=res;route();
    const ok=res.filter(x=>x.tracking).length,bad=res.length-ok;
    toast(bad?`تصيفطو ${ok} · ${bad} رفضهم COLIX`:`✅ تصيفطو ${ok} كولي لـ COLIX`);
    return true;
  }catch(e){toast("ما تصيفطوش لـ COLIX: "+e.message)}
  finally{PUSHING=false}
}

function csvCell(v){v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function ordersCsv(){
  const H=["Date","Client","Téléphone","Ville","Adresse","Produit","Qté","Prix","Confirmeuse","Confirmation","Livraison","Date livraison","Tracking","Frais livraison","Archive"];
  const rows=allOrders().slice().sort((a,b)=>a.d.localeCompare(b.d)).map(o=>[o.d,o.n,phone(o.p),o.c,o.ad,o.pr,o.q||1,o.pz||0,o.a,o.cs,o.ds||"",o.ld||"",o.t||"",delivFeeOf(o),o.imp?"oui":""]);
  return "﻿"+[H].concat(rows).map(r=>r.map(csvCell).join(",")).join("\n");
}

/* ================= confirmers: what each one sees ================= */
let pubT=null,PUB_HASH={};
function confPayload(name){
  const c=ST.confirmers.find(x=>x.name===name)||{name,fee:0};
  const A=confAccount(name);
  const pays=(ST.payouts||[]).filter(p=>p.c===name).map(p=>({date:p.date,amount:+p.amount||0,note:p.note||"",proof:p.proof||"",...(p.kind==="bonus"?{kind:"bonus"}:{})}));
  return {name,fee:+c.fee||0,paid:A.paid,pays,acct:{oldN:A.oldN,newN:A.newN,eOld:A.eOld,eNew:A.eNew,paid:A.paid,due:A.due,dueOld:A.dueOld,dueNew:A.dueNew},start:ST.start||""};
}
function schedulePublish(){if(!ISOWNER||!SB)return;clearTimeout(pubT);pubT=setTimeout(publishConf,2500)}
async function publishConf(){
  for(const c of ST.confirmers){if(!c.fee&&!(ST.payouts||[]).some(p=>p.c===c.name))continue;
    const p=confPayload(c.name),h=jstr(p);if(PUB_HASH[c.name]===h)continue;
    try{const {error}=await SB.from("conf_pub").upsert({confirmer:c.name,data:p});if(!error)PUB_HASH[c.name]=h}catch(e){}}
}

/* ================= confirmer view (non-owner) ================= */
let CV={doc:null,filter:"call",local:{}},CRT=null;
async function loadConfirmer(){
  const me=PROFILE.confirmer;
  await loadCalls();
  const [pub,rows]=await Promise.all([SB.from("conf_pub").select("data").eq("confirmer",me).maybeSingle(),pageAll("orders","id,data")]);
  const d=(pub.data&&pub.data.data)||{name:me,fee:0,paid:0,pays:[],acct:null,start:""};
  const st=d.start||"";const fr=x=>!st||x>=st;
  d.name=d.name||me;
  d.orders=rows.map(r=>r.data).filter(o=>o&&o.d&&((o.ld&&fr(o.ld))||(!o.imp&&fr(o.d)))).sort((a,b)=>b.d.localeCompare(a.d)||String(b.id).localeCompare(String(a.id)));
  CV.doc=d;CV.local={};
}
async function startConfirmerMode(){
  document.querySelector("#nav").hidden=true;$("syncBtn").hidden=true;
  try{await loadConfirmer()}catch(e){$("view").innerHTML='<p class="empty">مشكل فالاتصال، عاودي حلي الصفحة</p>';return}
  viewConfirmer();
  let t=null;const again=()=>{clearTimeout(t);t=setTimeout(async()=>{const a=document.activeElement;if(a&&a.matches&&a.matches("input"))return;try{await loadConfirmer();viewConfirmer()}catch(e){}},800)};
  CRT=SB.channel("bidabell-conf").on("postgres_changes",{event:"*",schema:"public",table:"orders"},again)
    .on("postgres_changes",{event:"*",schema:"public",table:"conf_pub"},again).subscribe();
}

/* ================= calls & messages to clients (logged in the "calls" table) ================= */
let CALLS=[],CALLS_WARN=false,PENDING_CALL=null;
async function loadCalls(){try{const since=new Date(Date.now()-120*864e5).toISOString();
  const {data,error}=await SB.from("calls").select("*").gte("at",since).order("at",{ascending:false}).limit(10000);
  if(!error)CALLS=data||[]}catch(e){}}
function myName(){return ISOWNER?"LAHOUCINE":String((PROFILE&&PROFILE.confirmer)||"")}
function niceName(n){n=String(n||"");return n?n[0].toUpperCase()+n.slice(1).toLowerCase():""}
function mmss(s){s=Math.max(0,Math.round(+s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
async function logContact(row){
  const r={order_id:row.order_id,confirmer:row.confirmer||myName(),kind:row.kind,secs:row.secs==null?null:Math.round(row.secs),outcome:row.outcome||null,note:row.note||null,phone:row.phone||null};
  const tmp={...r,id:"tmp"+Date.now(),at:new Date().toISOString()};CALLS.unshift(tmp);
  try{const {data,error}=await SB.from("calls").insert(r).select().single();if(error)throw error;Object.assign(tmp,data)}
  catch(e){if(!CALLS_WARN){CALLS_WARN=true;toast("ما تسجلاتش (خاص جدول calls ف Supabase)")}}
  return tmp}
function msgText(o){const first=String(o.n||"").trim().split(/\s+/)[0]||"";

/* ================= global search (any order or client, old ones too) ================= */
function gSearch(q){
  q=q.trim().toLowerCase();if(q.length<2)return [];
  const digits=q.replace(/\D/g,""),dq=digits.length>=4?digits.replace(/^212/,"").replace(/^0/,""):"";
  return allOrders().filter(o=>{
    if(dq&&String(o.p||"").replace(/\D/g,"").replace(/^212/,"").replace(/^0/,"").includes(dq))return true;
    return [o.n,o.t,o.c,o.ad,o.pr,o.a].some(x=>String(x||"").toLowerCase().includes(q))}).sort((a,b)=>b.d.localeCompare(a.d));
}
function gRender(){
  const box=$("gRes"),q=$("gq").value;if(!box)return;
  const res=gSearch(q);if(q.trim().length<2){box.hidden=true;return}

/* ================= ad cost per delivered order, by the day the orders came in ================= */
function viewCost(){
  const C=UI.cost||(UI.cost={from:shiftDays(today(),-13),to:today(),g:""});
  const grpOk=o=>!C.g||groupOf(o.pr)===C.g;
  const adsOn=d=>allExp().filter(e=>e.cat==="إشهار Meta"&&e.date===d&&(!C.g||e.prod===C.g||groupOf(e.prod||"")===C.g)).reduce((a,e)=>a+(+e.amount||0),0);
  /* normal delivery rate of finished parcels in the last 60 days, used to guess how many still on the road will be delivered */
  const fin=allOrders().filter(o=>grpOk(o)&&o.d>=shiftDays(today(),-60)&&(dGroup(o)==="del"||dGroup(o)==="ret"));
  const rate=fin.length?fin.filter(o=>dGroup(o)==="del").length/fin.length:0.6;
  const days=[];for(let d=C.to;d>=C.from&&days.length<62;d=shiftDays(d,-1))days.push(d);
  const row=d=>{const os=allOrders().filter(o=>o.d===d&&grpOk(o)),ads=adsOn(d);
    const conf=os.filter(o=>o.cs==="Confirmé").length,del=os.filter(o=>dGroup(o)==="del").length,ret=os.filter(o=>dGroup(o)==="ret").length;
    const tr=os.filter(o=>o.cs==="Confirmé"&&(dGroup(o)==="transit"||dGroup(o)==="none")).length,exp=del+tr*rate;
    return{d,ads,n:os.length,conf,del,ret,tr,exp}};
  const rows=days.map(row).filter(r=>r.n||r.ads);
  const noAds=rows.filter(r=>!r.ads&&r.n).length;
  const T=rows.filter(r=>r.ads).reduce((a,r)=>{["ads","n","conf","del","ret","tr","exp"].forEach(k=>a[k]+=r[k]);return a},{ads:0,n:0,conf:0,del:0,ret:0,tr:0,exp:0});
  const per=(a,b)=>a>0&&b>0?dh(a/b):"—";
  $("view").innerHTML=`
  <div class="head"><div><h1>تكلفة الإشهار</h1><div class="sub">لكل نهار: شحال صرفتي فالإشهار، وشحال جاو من طلبية فداك النهار، وشحال منهم توصلو حتى لدابا. هكا كتعرف بشحال قامت عليك كل طلبية توصلات.</div></div></div>
  <div class="card" style="padding:12px"><div class="bar">
    <label class="field">من<input type="date" id="coF" value="${esc(C.from)}"></label>
    <label class="field">حتى<input type="date" id="coT" value="${esc(C.to)}"></label>
    ${[["","كلشي"],["CHARIT","CHARIT"],["BAGIT","BAGIT"]].map(([k,l])=>`<button class="chip" data-cog="${k}" aria-pressed="${C.g===k}">${l}</button>`).join("")}
  </div></div>
  ${noAds?`<div class="card" style="border-color:var(--warn);background:var(--warn-soft)"><b style="color:var(--warn)">⚠️ ${noAds} نهار فيهم طلبيات وما دخلتيش الإشهار ديالهم. ما داخلينش فالمجموع، دخلهم من "الإشهار والمصاريف" باش يكون الحساب كامل.</b></div>`:""}
  <div class="kpis">
    <div class="kpi hero"><span class="l">التكلفة ديال كل طلبية توصلات (حتى لدابا)</span><span class="v num">${per(T.ads,T.del)}</span><span class="s">${nf.format(T.del)} توصلات من ${nf.format(T.conf)} مأكدة</span></div>
    <div class="kpi"><span class="l">المتوقع ملي يتوصلو اللي فالطريق</span><span class="v num">${per(T.ads,T.exp)}</span><span class="s">${nf.format(T.tr)} باقي فالطريق · نسبة التوصيل ${Math.round(rate*100)}%</span></div>
    <div class="kpi"><span class="l">الإشهار</span><span class="v num">${dh(T.ads)}</span><span class="s">${per(T.ads,T.n)} على كل طلبية جات</span></div>
    <div class="kpi"><span class="l">الطلبيات</span><span class="v num">${nf.format(T.n)}</span><span class="s">${nf.format(T.ret)} رجعات</span></div>
  </div>
  <div class="card" style="padding:8px 12px">${rows.length?`<div class="tw"><table><thead><tr><th>النهار</th><th class="r">الإشهار</th><th class="r">الطلبيات</th><th class="r">مأكدة</th><th class="r">توصلات</th><th class="r">فالطريق</th><th class="r">رجعات</th><th class="r">على كل طلبية</th><th class="r">على كل توصلات (دابا)</th><th class="r">المتوقع</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="num">${esc(r.d)}</td><td class="r num">${r.ads?nf.format(r.ads):"—"}</td><td class="r num">${r.n}</td><td class="r num">${r.conf}</td><td class="r num">${r.del}</td><td class="r num">${r.tr||""}</td><td class="r num">${r.ret||""}</td><td class="r num">${per(r.ads,r.n)}</td><td class="r num"><b>${per(r.ads,r.del)}</b></td><td class="r num">${!r.ads?"<small>ما دخلتيش الإشهار</small>":r.tr?per(r.ads,r.exp):"<small>سالا</small>"}</td></tr>`).join("")}
  </tbody></table></div><p class="note">"دابا" = غير اللي توصلو حتى لهاد الساعة، كينقص كل ما توصل شي واحد. "المتوقع" = إلى توصلو اللي فالطريق بنفس النسبة العادية ديالك (${Math.round(rate*100)}%). ملي كيسالي النهار (ما بقا حتى واحد فالطريق) كيبان "سالا" والرقم ديال "دابا" هو النهائي.</p>`:'<p class="empty">ما كاين حتى إشهار ولا طلبية فهاد الفترة</p>'}</div>`;
  $("coF").onchange=e=>{if(e.target.value){C.from=e.target.value;viewCost()}};
  $("coT").onchange=e=>{if(e.target.value){C.to=e.target.value;viewCost()}};
  document.querySelectorAll("[data-cog]").forEach(b=>b.onclick=()=>{C.g=b.dataset.cog;viewCost()});
}

function setPreset(p){
  const t=today(),D=UI.dash;D.preset=p;
  if(p==="today"){D.from=t;D.to=t}
  if(p==="7"){D.from=shiftDays(t,-6);D.to=t}
  if(p==="month"){D.from=monthStart();D.to=t}
  if(p==="last"){const m=prevMonth(t.slice(0,7));D.from=monthStart(m);D.to=monthEnd(m)}
  if(p==="all"){D.from=UI.archive||!ST.start?"2000-01-01":ST.start;D.to="2999-12-31"}
}
function viewDash(){
  const D=UI.dash;
  const inRange=d=>d>=D.from&&d<=D.to;
  const ords=curOrders().filter(o=>(inRange(o.d)||(o.ld&&inRange(o.ld)))&&(!D.prod||o.pr===D.prod));
  const expsR=curExp().filter(e=>inRange(e.date)),ordsR=curOrders().filter(o=>inRange(o.d)||(o.ld&&inRange(o.ld)));
  const exps=D.prod?expFor(expsR,D.prod,ordsR):expsR;
  const s=stats(ords,exps);

function bindDrill(){

function chart(rows){
  if(!rows.length)return '<p class="empty">ما كاين حتى معطيات</p>';
  const W=560,H=230,L=58,R=12,T=14,B=30,vals=rows.map(r=>r.s.profit);
  let max=Math.max(0,...vals),min=Math.min(0,...vals);
  const step=niceStep((max-min)||1000);max=Math.ceil(max/step)*step;min=Math.floor(min/step)*step;if(max===min)max=step;
  const y=v=>T+(max-v)/(max-min)*(H-T-B);
  const bw=(W-L-R)/rows.length,barW=Math.min(42,bw*0.6);
  let g="";for(let v=min;v<=max+1e-6;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${nf.format(v)}</text>`}
  const bars=rows.map((r,i)=>{const v=r.s.profit,x=L+i*bw+(bw-barW)/2,y0=y(0),y1=y(v),h=Math.max(1,Math.abs(y1-y0)),top=Math.min(y0,y1);
    return `<g class="b" data-t="${esc(mLabel(r.m))}: ${esc(dh(v))}" data-x="${x+barW/2}" data-y="${top}"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/><rect x="${x}" y="${top}" width="${barW}" height="${h}" rx="4" fill="${v<0?"var(--bad)":"var(--gold)"}"/><text x="${x+barW/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(MONTHS[+r.m.slice(5)-1])}</text></g>`}).join("");
  return `<div class="chart" id="pchart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الربح الصافي حسب الشهر">${g}<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>${bars}</svg><div class="tip num" id="ptip"></div></div>`;
}
function niceStep(range){const r=range/4,p=Math.pow(10,Math.floor(Math.log10(r)));const n=r/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function bindChart(){
  const c=$("pchart");if(!c)return;const tip=$("ptip"),svg=c.querySelector("svg");
  c.querySelectorAll("g.b").forEach(g=>{
    g.onmouseenter=()=>{const k=svg.getBoundingClientRect().width/560;tip.textContent=g.dataset.t;tip.style.left=(+g.dataset.x*k)+"px";tip.style.top=(+g.dataset.y*k)+"px";tip.style.transform="translate(-50%,-115%)";tip.style.opacity=1};
    g.onmouseleave=()=>{tip.style.opacity=0};
  });
}

/* how far a parcel has gone; a sync never moves a parcel back to an earlier step */
function dsRank(ds){ds=String(ds||"");if(!ds)return 0;
  const R={"Success":1,"Nouveau Colis":1,"Attente De Ramassage":2,"Ramassé":3,"Reçu":4,"Expédié":5,"Mise en distribution":6};
  if(R[ds])return R[ds];if(ds==="Livré"||RET.has(ds))return 9;return 7}
/* parcels created at COLIX that never left: still "Nouveau Colis" / "Attente De Ramassage" a day later (usually no stock at COLIX) */
const STUCK_DAYS=1;
function sentDay(o){const h=(o.hist||[]).map(histDate).filter(Boolean).sort()[0];return (h||o.d||"").slice(0,10)}
function stuckDays(o){if(!o.t||o.imp||dsRank(o.ds)>2||CANCEL.has(o.cs))return -1;const d=sentDay(o);if(!d)return -1;
  const n=Math.floor((new Date(today()+"T00:00:00")-new Date(d+"T00:00:00"))/864e5);return n>=STUCK_DAYS?n:-1}
function stuckList(){return allOrders().filter(o=>stuckDays(o)>=0)}
function stuckPill(o){const n=stuckDays(o);return n<0?"":` <span class="pill p-bad" title="تصيفطات لـ COLIX ولكن باقي ما خرجاتش (ممكن ما كاينش الستوك عندهم)">⏳ ما خرجاتش · ${n} ${n===1?"نهار":"أيام"}</span>`}
function dsNewer(oldDs,newDs){return !!newDs&&newDs!==oldDs&&dsRank(newDs)>=dsRank(oldDs)}
function parseColix(txt){
  const L=String(txt).split(/\r?\n/),out=[],trk=/^[0-9]{0,2}-?[A-Za-z]{2,4}\d{8,}[A-Za-z]{2}$/;
  for(let i=0;i<L.length;i++){
    const t=L[i].trim();if(!trk.test(t))continue;
    let ds="",date="";const phones=[];
    for(let j=i+1;j<L.length&&j<i+25;j++){const x=L[j];if(trk.test(x.trim()))break;
      const m=x.match(/(?:^|\t)\s*(Non Payé|Payé|Non paye|Paye)\s*\t\s*([^\t]+?)\s*(?:\t|$)/i);if(m)ds=m[2].trim();
      const dm=x.match(/(\d{4}-\d{2}-\d{2})\s+\d{1,2}:\d{2}/);if(dm&&!date)date=dm[1];
      /* phone numbers in the row: the client's, and the COLIX agent's (her name is on the line just before) */
      const pm=x.trim().match(/^(?:\+?212|0)[5-7]\d{8}$/);
      if(pm){let k=j-1;while(k>i&&!L[k].trim())k--;phones.push({p:pm[0],name:k>i?L[k].split("\t").pop().trim().slice(0,40):""})}}
    if(ds||phones.length)out.push({t,ds,date,phones});
  }
  return out;
}

function confAccount(name){
  const c=ST.confirmers.find(x=>x.name===name)||{fee:0},fee=+c.fee||0,seen=new Set();let oldN=0,newN=0;
  allOrders().forEach(o=>{if(o.a!==name||o.ds!=="Livré")return;const k=o.t||o.id;if(seen.has(k))return;seen.add(k);if(freshO(o))newN++;else oldN++});
  /* a bonus is a gift on top: it is listed with the payments but does not pay off commissions */
  const paid=(ST.payouts||[]).filter(p=>p.c===name&&p.kind!=="bonus").reduce((a,p)=>a+(+p.amount||0),0);
  const eOld=oldN*fee,eNew=newN*fee,dueOld=Math.max(0,eOld-paid),dueNew=Math.max(0,eNew-Math.max(0,paid-eOld));

}

/* ================= stock ================= */
function viewStock(){
  const ords=allOrders().filter(freshO),low=+ST.lowStock||15;
  const rows=ST.products.filter(p=>!p.off).map(p=>{
    const os=ords.filter(o=>o.pr===p.name);
    const del=os.filter(o=>dGroup(o)==="del").reduce((a,o)=>a+(+o.q||1),0);
    const tr=os.filter(o=>dGroup(o)==="transit").reduce((a,o)=>a+(+o.q||1),0);
    const back=os.filter(o=>dGroup(o)==="ret"&&o.t&&!o.rcv).reduce((a,o)=>a+(+o.q||1),0); /* returned by COLIX but not in hand yet */
    return{p,del,tr,back,actual:(+p.stock0||0)-del-tr-back,tracked:(+p.stock0||0)>0};
  });
  const value=rows.filter(r=>r.tracked).reduce((a,r)=>a+Math.max(0,r.actual)*(+r.p.cost||0),0);
  $("view").innerHTML=`
  <div class="head"><div><h1>الستوك</h1><div class="sub">الستوك الحالي = كل اللي دخل ناقص اللي توصل، واللي فالطريق، واللي راجع وباقي ما وصلكش</div></div></div>
  <div class="kpis"><div class="kpi"><span class="l">قيمة الستوك (بثمن الشرا)</span><span class="v num">${dh(value)}</span></div>
  <div class="kpi"><span class="l">منتوجات قربو يساليو</span><span class="v num">${rows.filter(r=>r.tracked&&r.actual<low).length}</span><span class="s">تحت ${low} حبة</span></div></div>
  <div class="card"><div class="tw"><table><thead><tr><th>المنتوج</th><th class="r">دخل للستوك</th><th class="r">توصل</th><th class="r">فالطريق</th><th class="r">راجع (ما وصلش)</th><th class="r">الستوك الحالي</th><th></th><th>زيد ستوك</th></tr></thead><tbody>
  ${rows.map(({p,del,tr,back,actual,tracked},i)=>`<tr><td>${esc(p.name)}</td><td class="r num">${nf.format(p.stock0||0)}</td><td class="r num">${del}</td><td class="r num">${tr}</td><td class="r num">${back?`<a href="#returns" style="color:var(--bad)">${back}</a>`:0}</td><td class="r num"><b>${tracked?nf.format(actual):"—"}</b></td>
    <td>${!tracked?'<span class="pill p-none">ما مسجلش</span>':actual<=0?'<span class="pill p-bad">سالا</span>':actual<low?'<span class="pill p-warn">قرب يسالي</span>':'<span class="pill p-good">مزيان</span>'}</td>
    <td><div class="bar" style="flex-wrap:nowrap"><input class="inp num" style="width:80px" inputmode="numeric" id="rs${i}" placeholder="0" aria-label="الكمية"><button class="btn sec" data-rs="${i}" style="padding:5px 10px">زيد</button></div></td></tr>`).join("")}
  </tbody></table></div>
  <p class="note">ملي تشري سلعة جديدة، كتب الكمية وكليكي "زيد". ثمن الشرا ديال الطلبيات اللي توصلات كيتحسب بوحدو فالأرباح.</p></div>
  ${(ST.restocks||[]).length?`<div class="card"><h2>سجل دخول السلعة</h2><div class="list">${ST.restocks.slice().reverse().slice(0,30).map(r=>`<div class="li"><span>${esc(r.p)} <small class="num">${esc(r.date)}</small></span><span class="num">+${nf.format(r.qty)}</span></div>`).join("")}</div></div>`:""}`;
  document.querySelectorAll("[data-rs]").forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.rs,q=parseInt($("rs"+i).value);if(!(q>0)){toast("كتب الكمية");return}
    const p=rows[i].p;if(!p.stock0){const r=rows[i];p.stock0=r.del+r.tr+r.back}
    p.stock0=(+p.stock0||0)+q;ST.restocks=[...(ST.restocks||[]),{p:p.name,qty:q,date:today()}];
    viewStock();try{await writeSettings();toast("تزاد الستوك ديال "+p.name)}catch(e){toast(failMsg(e))}
  });
}

/* ================= daily ads ================= */
function adsTargets(){return ["CHARIT","BAGIT"]}
function adsOf(date){return (EXP[date.slice(0,7)]||[]).filter(e=>e.cat==="إشهار Meta"&&e.date===date)}
function adsPanel(){
  const X=UI.exp;if(!X.adsDate||X.adsDate.slice(0,7)!==X.m)X.adsDate=X.m===today().slice(0,7)?today():monthStart(X.m);
  const day=adsOf(X.adsDate),val=p=>{const e=day.filter(x=>(x.prod||"عام")===p);if(!e.length)return "";const s=e.reduce((a,x)=>a+(x.usd!=null?+x.usd:(+x.amount/(+x.rate||ST.rate))),0);return Math.round(s*100)/100};
  // month table
  const ads=(EXP[X.m]||[]).filter(e=>e.cat==="إشهار Meta"),dates=[...new Set(ads.map(e=>e.date))].sort().reverse();
  const cols=[...new Set(adsTargets().concat(ads.map(e=>e.prod||"عام")))].filter(p=>ads.some(e=>(e.prod||"عام")===p));

    </div>
    <div class="actions" style="margin-top:10px;align-items:center"><button class="btn" type="submit">سجل إشهار ${X.adsDate===today()?"اليوم":esc(X.adsDate)}</button><span class="note" id="adSum"></span></div></form>
    ${dates.length?`<div class="tw"><table><thead><tr><th>النهار</th>${cols.map(c=>`<th class="r">${esc(c)}</th>`).join("")}<th class="r">المجموع</th><th class="r">الطلبيات</th><th class="r">ثمن الطلبية</th></tr></thead><tbody>
      ${dates.map(d=>{const de=ads.filter(e=>e.date===d),sum=de.reduce((a,e)=>a+(+e.amount||0),0),n=ords.filter(o=>o.d===d).length;
        return `<tr class="click" data-ad="${d}"><td class="num">${d.slice(5)}</td>${cols.map(c=>{const v=de.filter(e=>(e.prod||"عام")===c).reduce((a,e)=>a+(+e.amount||0),0);return `<td class="r num">${v?nf.format(v):"—"}</td>`}).join("")}<td class="r num"><b>${dh(sum)}</b></td><td class="r num">${n}</td><td class="r num">${n?dh(sum/n):"—"}</td></tr>`}).join("")}
      <tr><td><b>الشهر</b></td>${cols.map(c=>`<td class="r num">${nf.format(ads.filter(e=>(e.prod||"عام")===c).reduce((a,e)=>a+(+e.amount||0),0))}</td>`).join("")}<td class="r num"><b>${dh(tot)}</b></td><td class="r num">${ords.length}</td><td class="r num">${ords.length?dh(tot/ords.length):"—"}</td></tr>
    </tbody></table></div><p class="note">المبالغ فالجدول بالدرهم. كليكي على شي نهار باش تبدلو.</p>`:""}
  </div>`;
}
function bindAds(){
  const X=UI.exp,targets=adsTargets();
  const upd=()=>{const s=targets.reduce((a,_,i)=>a+(parseFloat(($("ad"+i).value||"").replace(",","."))||0),0);$("adSum").innerHTML=s?`<span class="num">${nf2.format(s)}$ = ${dh(s*ST.rate)}</span>`:""};
  targets.forEach((_,i)=>$("ad"+i).addEventListener("input",upd));upd();
  $("adDate").onchange=e=>{if(!e.target.value)return;X.adsDate=e.target.value;X.m=X.adsDate.slice(0,7);viewExp()};
  document.querySelectorAll("[data-ad]").forEach(tr=>tr.onclick=()=>{X.adsDate=tr.dataset.ad;viewExp();window.scrollTo(0,0)});
  $("adsF").onsubmit=async e=>{e.preventDefault();
    const date=X.adsDate,m=date.slice(0,7),keep=(EXP[m]||[]).filter(x=>!(x.cat==="إشهار Meta"&&x.date===date));
    const add=[];targets.forEach((p,i)=>{const usd=parseFloat(($("ad"+i).value||"").replace(/\s/g,"").replace(",","."));
      if(usd>0)add.push({id:uid("a"),amount:Math.round(usd*ST.rate*100)/100,usd,rate:ST.rate,cat:"إشهار Meta",prod:p,note:"",date,created:Date.now()})});
    EXP[m]=keep.concat(add);document.activeElement.blur();viewExp();
    try{await writeExp(m);toast(add.length?"تسجل الإشهار ديال "+date:"تمسح الإشهار ديال "+date)}catch(err){toast(failMsg(err))}};
}

    <label class="field">كل مدينة فسطر: السمية والثمن (مثلا: Casablanca 25)<textarea id="cityTxt" class="inp num" rows="7" style="direction:ltr;text-align:left;resize:vertical" placeholder="Casablanca 25&#10;Rabat 35&#10;Marrakech 35"></textarea></label>
    <div class="actions"><button class="btn" type="button" id="cityAdd">زيد / بدل هاد المدن</button>${Object.keys(CITY).length?`<button class="btn sec" type="button" id="cityShow">${UI.showCities?"خبي اللائحة":"وري اللائحة"}</button>`:""}</div>
    ${UI.showCities&&Object.keys(CITY).length?`<div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th>المدينة</th><th class="r">الثمن</th></tr></thead><tbody>${Object.values(CITY).sort((a,b)=>a.n.localeCompare(b.n)).map(c=>`<tr><td>${esc(c.n)}</td><td class="r num">${nf2.format(c.f)}</td></tr>`).join("")}</tbody></table></div>`:""}
  </div>`;
  const acc=document.createElement("div");acc.id="accBox";$("view").appendChild(acc);
  confAccessSection().then(async h=>{if(!$("accBox"))return;const bk=await backupList();if(!$("accBox"))return;
    $("accBox").innerHTML=h+`<div class="card" style="margin-top:16px"><h2>Backup</h2><div class="sub">كل نهار، السيرفور كيسجل نسخة كاملة من كاع المعلومات بوحدو (كيبقاو 60 يوم). وتقدر تحمل نسخة لعندك فأي وقت.</div>
    ${bk.length?`<div class="list">${bk.slice(0,7).map(f=>`<div class="li"><span class="num">${esc(f.name.replace(".json",""))}</span><a href="#" data-bk="${esc(f.name)}" style="color:var(--info)">تحميل</a></div>`).join("")}</div>`:'<p class="note">باقي حتى Backup ديال السيرفور.</p>'}
    <div class="actions"><button class="btn sec" id="bkNow">دير Backup دابا</button><button class="btn sec" id="dlJson">حمل نسخة لعندي (JSON)</button><button class="btn sec" id="dlCsv">حمل الطلبيات (Excel / CSV)</button></div></div>
    <div class="card" style="margin-top:16px"><h2>COLIX</h2><div class="sub">الطلبيات المأكدة كتصيفطهم لـ COLIX بالبوطونة "Add colis" فصفحة الطلبيات. الحالات كيتحدثو بوحدهم كل 20 دقيقة (COLIX كيخلي نسولو على نفس الكولي مرة ف 3 سوايع).</div><div class="actions"><button class="btn sec" id="pingCx">جرب الاتصال بـ COLIX</button><span class="note" id="pingMsg"></span></div></div>
    <div class="card" style="margin-top:16px"><h2>نقل الداتا من الصفحة القديمة</h2><div class="sub">مرة وحدة: ختار الملف اللي عطاك Claude. ما كيتعاودوش الطلبيات إلا عاودتي.</div><label class="field">الملف (.json)<input type="file" id="impF" accept="application/json,.json"></label><p class="note" id="impMsg">${esc(IMP_MSG)}</p></div>`;
    bindConfAccess();
    document.querySelectorAll("[data-bk]").forEach(a=>a.onclick=e=>{e.preventDefault();openBackup(a.dataset.bk)});
    $("bkNow").onclick=async()=>{const b=$("bkNow");b.disabled=true;b.textContent="كيتسجل…";try{const r=await fn("backup");toast("✅ تسجل Backup ("+r.orders+" طلبية)")}catch(e){toast("ما تسجلش: "+e.message)}viewSettings()};
    $("dlJson").onclick=()=>download("BIDABELL backup "+today()+".json",JSON.stringify({v:1,at:Date.now(),ST,CITY,EXP,ORD}),"application/json");
    $("dlCsv").onclick=()=>download("BIDABELL commandes "+today()+".csv",ordersCsv(),"text/csv;charset=utf-8");
    $("pingCx").onclick=async()=>{$("pingMsg").textContent="…";try{const r=await fn("ping");$("pingMsg").textContent=r.colix?"✅ السيرفور خدام والتوكن ديال COLIX كاين":"⚠️ السيرفور خدام ولكن التوكن ديال COLIX ما كاينش"}catch(e){$("pingMsg").textContent="⚠️ "+e.message}};
    $("impF").onchange=()=>{const f=$("impF").files[0];if(f)importOld(f)};
  });
  $("cityAdd").onclick=async()=>{const add=parseCities($("cityTxt").value),n=Object.keys(add).length;if(!n){toast("ما فهمتش اللائحة. كتب السمية والثمن فكل سطر");return}
    CITY={...CITY,...add};viewSettings();try{await writeCities();toast("تزادو "+n+" مدينة")}catch(e){toast(failMsg(e))}};
  if($("cityShow"))$("cityShow").onclick=()=>{UI.showCities=!UI.showCities;viewSettings()};
  const collect=()=>{
    const n=x=>{const f=parseFloat(String(x).replace(",","."));return isFinite(f)?f:0};
    ST.products=ST.products.map((p,i)=>({...p,name:$("pn"+i).value.trim()||p.name,cost:n($("pc"+i).value),price:n($("pp"+i).value),pack:n($("pk"+i).value)}));
    ST.confirmers=ST.confirmers.map((c,i)=>({...c,name:$("cn"+i).value.trim().toUpperCase()||c.name,fee:n($("cf"+i).value)}));
    ST.delivFee=n($("sDf").value);ST.returnFee=n($("sRf").value);ST.rate=n($("sRate").value)||9.33;ST.lowStock=n($("sLow").value)||15;
  };
  document.querySelectorAll("[data-pimg]").forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const url=await shrinkImg(f,240);collect();ST.products[+inp.dataset.pimg].img=url;viewSettings();await writeSettings();toast("✅ تسجلات التصويرة")}catch(e){toast("ما قدرتش نقرا التصويرة")}});
  document.querySelectorAll("[data-pimgx]").forEach(b=>b.onclick=async()=>{collect();delete ST.products[+b.dataset.pimgx].img;viewSettings();try{await writeSettings();toast("تحيدات التصويرة")}catch(e){toast(failMsg(e))}});
  $("addP").onclick=()=>{collect();ST.products.push({name:"منتوج جديد",cost:0,price:0,pack:1,stock0:0});viewSettings()};
  $("addC").onclick=()=>{collect();ST.confirmers.push({name:"NOUVELLE",fee:10});viewSettings()};
  /* "وقف" hides an item from new orders but keeps it, so old orders, costs and commissions stay correct */
  const toggleOff=(list,i,key)=>{collect();const it=list[i];
    if(!it.off&&UI.rmArm!==key){UI.rmArm=key;viewSettings();return}
    UI.rmArm=null;it.off=!it.off;viewSettings();toast(it.off?"توقف "+it.name+" · كليكي \"سجل الإعدادات\"":"رجع "+it.name+" · كليكي \"سجل الإعدادات\"")};
  document.querySelectorAll("[data-rmp]").forEach(b=>b.onclick=()=>toggleOff(ST.products,+b.dataset.rmp,"p"+b.dataset.rmp));
  document.querySelectorAll("[data-rmc]").forEach(b=>b.onclick=()=>toggleOff(ST.confirmers,+b.dataset.rmc,"c"+b.dataset.rmc));
  $("sform").onsubmit=async e=>{e.preventDefault();
    const before=ST.products.map(p=>p.name);collect();
    const ren={};ST.products.forEach((p,i)=>{if(before[i]&&before[i]!==p.name)ren[before[i]]=p.name});
    document.activeElement.blur();
    try{
      await writeSettings();
      if(Object.keys(ren).length){
        const ws=[];
        for(const m of Object.keys(ORD)){let ch=false;ORD[m].forEach(o=>{if(ren[o.pr]){o.pr=ren[o.pr];ch=true}});if(ch)ws.push(writeOrders(m))}
        for(const m of Object.keys(EXP)){let ch=false;EXP[m].forEach(x=>{if(ren[x.prod]){x.prod=ren[x.prod];ch=true}});if(ch)ws.push(writeExp(m))}
        await Promise.all(ws);
      }
      toast(Object.keys(ren).length?"تسجلات الإعدادات وتبدلات السمية فكاع الطلبيات":"تسجلات الإعدادات");
    }catch(err){toast(failMsg(err))}};
}

route();init();
</script>
</body>
</html>
