<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunken:#E7ECE9; --ink:#10201B; --muted:#5B6B65; --line:#D6DFDA;
  --brand:#0E3D34; --brand-ink:#EEF6F2; --accent:#C99A1E; --accent-soft:#F6ECCD;
  --good:#16794F; --good-soft:#DDF2E7; --bad:#B23A30; --bad-soft:#F8E1DE; --warn:#9A6400; --warn-soft:#FBEBCB; --info:#2D5BB9; --info-soft:#E0E8F8;
  --font:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic","Noto Sans",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09130F; --surface:#111E19; --sunken:#0C1814; --ink:#E4EEE9; --muted:#93A69E; --line:#22352D;
  --brand:#0B2E27; --brand-ink:#E4EEE9; --accent:#E6B840; --accent-soft:#3A3115;
  --good:#4CC796; --good-soft:#12322A; --bad:#F07F72; --bad-soft:#3A1E1B; --warn:#F0B44C; --warn-soft:#3A2C12; --info:#86A9F0; --info-soft:#18284A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09130F; --surface:#111E19; --sunken:#0C1814; --ink:#E4EEE9; --muted:#93A69E; --line:#22352D;
  --brand:#0B2E27; --brand-ink:#E4EEE9; --accent:#E6B840; --accent-soft:#3A3115;
  --good:#4CC796; --good-soft:#12322A; --bad:#F07F72; --bad-soft:#3A1E1B; --warn:#F0B44C; --warn-soft:#3A2C12; --info:#86A9F0; --info-soft:#18284A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--brand);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.5px;flex:1}
header h1 small{display:block;font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.hbtn{background:rgba(255,255,255,.12);color:inherit;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px 16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px;line-height:1}
nav button.on{color:var(--brand);font-weight:700}
:root[data-theme="dark"] nav button.on{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav button.on{color:var(--accent)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:var(--sunken);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.alert{border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--ink);border-inline-start:4px solid var(--warn)}
.alert.bad{background:var(--bad-soft);border-inline-start:4px solid var(--bad)}
.alert.info{background:var(--info-soft);border-inline-start:4px solid var(--info)}
.alert.good{background:var(--good-soft);border-inline-start:4px solid var(--good)}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--sunken);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--good);color:#fff}
.btn.no{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
input[type=number]{width:90px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
label.f input,label.f select{color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fgrid input,.fgrid select{width:100%}
.bar{height:9px;background:var(--sunken);border-radius:5px;overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--good);border-radius:5px}
.bar i.over{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:12.5px}
.tw{overflow-x:auto;margin:0 -4px}
.badge{display:inline-block;font-size:11px;border-radius:20px;padding:1px 8px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.badge.est{background:var(--warn-soft);color:var(--warn)}
.badge.ver{background:var(--good-soft);color:var(--good)}
.badge.on{background:var(--accent-soft);color:var(--ink)}
.ex{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.ex h4{margin:0 0 4px;font-size:14.5px}
.sets td input{width:64px;padding:6px}
.rec{font-size:13px;background:var(--info-soft);border-radius:8px;padding:6px 8px;margin:6px 0}
.ms{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);flex:none}
.dot.done{background:var(--good);border-color:var(--good)}
.chart{direction:ltr;width:100%;height:auto;display:block}
#timer{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));inset-inline:16px;max-width:728px;margin:0 auto;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:6;font-size:18px;font-weight:700}
#toast{position:fixed;top:70px;inset-inline:16px;max-width:500px;margin:0 auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:9;text-align:center;font-size:14px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
details summary{cursor:pointer;font-weight:600}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>

  <h1>FIT COACH PRO <small id="hsub"></small></h1>

</header>
<main id="app"></main>
<div id="timer" hidden><span id="timerTxt"></span><span style="flex:1"></span><button class="hbtn" id="timerStop">✕</button></div>
<div id="toast" hidden></div>
<nav id="nav"></nav>

 DEF_FOODS.forEach(f=>{if(!have.has(f.id))s.foods.push(Object.assign({},f))});
 return s;
}

/* ---------- calculations ---------- */
function curWeight(){const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].w:S.profile.weight}
const bmi=(w,h)=>w/Math.pow(h/100,2);
function bmr(){const p=S.profile;return 10*curWeight()+6.25*p.height-5*p.age+(p.sex==="f"?-161:5)}
const ACT={sed:1.2,light:1.375,mod:1.55};
function estimates(){
 const b=bmr(),f=ACT[S.profile.activity]||1.2;
 // gym on top of the chosen daily activity: about +0.12 to +0.22 of BMR (3–5 sessions/week)
 return {bmr:b,base:b*f,gymLo:b*(f+0.12),gymHi:b*(f+0.22)};
}
function macroKcal(tg){return tg.p*4+tg.c*4+tg.f*9}
function sortedWeights(){return [...S.weights].sort((a,b)=>a.d<b.d?-1:1)}
function weeklyAverages(){
 const m={};sortedWeights().forEach(e=>{const k=weekStart(e.d);(m[k]=m[k]||[]).push(e.w)});
 return Object.keys(m).sort().map(k=>({wk:k,avg:m[k].reduce((a,b)=>a+b,0)/m[k].length,n:m[k].length}));
}
/* linear-regression trend (kg/week) over the last 21 days of entries */
function trend(){
 const w=sortedWeights();if(!w.length)return null;
 const last=w[w.length-1].d;
 const pts=w.filter(e=>daysBetween(e.d,last)<=21).map(e=>({x:daysBetween(w[0].d,e.d),y:e.w}));
 if(pts.length<6)return null;
 const span=pts[pts.length-1].x-pts[0].x;if(span<12)return null;
 const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;
 let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)*(p.x-mx)});
 return {rate:sxx?sxy/sxx*7:0,n,span};
}
function weekNo(){return Math.max(1,Math.floor(daysBetween(S.profile.startDate,today())/7)+1)}
function milestones(){
 const a=S.profile.startWeight,b=S.profile.target,n=Math.max(1,Math.min(20,S.msCount|0||6));
 const out=[];for(let i=1;i<=n;i++){const w=Math.round((a+(b-a)*i/n)*2)/2;out.push({w,bmi:bmi(w,S.profile.height)})}
 return out;
}
function reviewStatus(){
 const since=S.lastReview||S.profile.startDate;const d=daysBetween(since,today());
 return {d,due:d>=14,over:d>21,next:Math.max(0,14-d)};
}
function hasPending(type){return S.proposals.some(p=>p.status==="pending"&&p.type===type)}
function runReview(){
 const tr=trend();if(!tr){toast(t("reviewNeed"));return}
 const r=tr.rate,{min,max}=S.gain;let delta=0,key="rInRange";
 if(r<0){delta=150;key="rLoss"}
 else if(r<min){delta=r<min/2?150:100;key="rSlow"}
 else if(r>max){delta=-(r>max*2?150:100);key="rFast"}
 S.lastReview=today();
 const msg=t(key,{r:r.toFixed(2),a:min,b:max,d:Math.abs(delta)})+(weekNo()<=4?" "+t("rEarly"):"");
 if(delta){
  S.proposals=S.proposals.filter(p=>!(p.type==="kcal"&&p.status==="pending"));
  const tg=S.targets,nc=Math.round(delta*0.7/4),nf=Math.round(delta*0.3/9);
  S.proposals.push({id:uid(),type:"kcal",status:"pending",created:today(),why:msg,
   to:{kcal:tg.kcal+delta,p:tg.p,c:Math.max(0,tg.c+nc),f:Math.max(0,tg.f+nf)},from:tg.kcal});
 } else {
  S.proposals.push({id:uid(),type:"note",status:"done",created:today(),why:msg});
  toast(t("noReviewChange"));
 }
 logChange("review: "+msg);save();render();
}
function recOk(r){return r.sleep>=7&&r.soreness<=3&&r.energy>=3}
function checkPhaseProposal(){
 const recent=S.recovery.filter(r=>daysBetween(r.d,today())<=7);
 if(S.phase==="fb3"&&weekNo()>=3&&!hasPending("phase")){
  const declined=S.phaseDeclined&&daysBetween(S.phaseDeclined,today())<7;
  if(!declined&&recent.length>=2&&recent.every(recOk))
   S.proposals.push({id:uid(),type:"phase",status:"pending",created:today(),to:"split5",why:t("phasePropWhy",{n:weekNo()})});
 }
 if(S.phase==="split5"&&!hasPending("phase")){
  const last2=S.recovery.slice(-2);
  const declined=S.phaseDeclined&&daysBetween(S.phaseDeclined,today())<7;
  if(!declined&&last2.length===2&&last2.every(r=>!recOk(r))&&daysBetween(last2[0].d,today())<=7)
   S.proposals.push({id:uid(),type:"phase",status:"pending",created:today(),to:"fb3",why:t("phaseBackWhy")});
 }
}
function phaseName(p){return p==="split5"?t("phaseSplit"):(weekNo()<=2?t("phaseFb3"):t("phaseFb3b"))}
function acceptProposal(id){
 const p=S.proposals.find(x=>x.id===id);if(!p)return;
 if(p.type==="kcal"){S.targets=Object.assign({},p.to);logChange(t("logKcal",{from:p.from,to:p.to.kcal}))}
 if(p.type==="phase"){S.phase=p.to;S.phaseStart=today();logChange(t("logPhase",{to:phaseName(p.to)}))}
 p.status="accepted";save();toast(t("applied"));render();
}
function rejectProposal(id){
 const p=S.proposals.find(x=>x.id===id);if(!p)return;
 p.status="rejected";if(p.type==="phase")S.phaseDeclined=today();save();toast(t("rejected"));render();
}

const food=id=>S.foods.find(f=>f.id===id);
function entryMacros(e){const f=food(e.food);if(!f)return {k:0,p:0,c:0,f:0};const m=e.g/100;return {k:f.k*m,p:f.p*m,c:f.c*m,f:f.f*m}}
function dayTotals(d){const t0={k:0,p:0,c:0,f:0};(S.diary[d]||[]).forEach(e=>{const m=entryMacros(e);for(const k in t0)t0[k]+=m[k]});return t0}

/* ---------- training ---------- */
function variantIdx(slot){const v=SLOTS[slot].v;for(let i=0;i<v.length;i++)if(v[i].eq.every(e=>S.equip[e]))return i;return v.length-1}
function prescription(slot){
 const main=SLOTS[slot].main,core=SLOTS[slot].bw;
 if(S.phase==="fb3"){
  const wk=weekNo();const sets=wk<=1?2:3;const rir=wk<=1?"3–4":"2–3";
  return {sets,a:core?20:(main?8:10),b:core?40:(main?12:15),rir,rirMin:wk<=2?2:1,rest:main?150:75};
 }
 return {sets:3,a:core?30:(main?6:10),b:core?60:(main?10:15),rir:"1–2",rirMin:1,rest:main?150:75};
}
function todayPlan(d){
 const dow=parseD(d||today()).getDay();
 if(S.phase==="split5"){const s=WEEK_SPLIT[dow];return s?{type:"train",session:s}:{type:"rest"}}
 const x=WEEK_FB3[dow];if(!x)return {type:"rest"};if(x==="walk")return {type:"walk"};
 const n=S.workouts.filter(w=>w.session==="A"||w.session==="B").length;
 const last=S.workouts.filter(w=>w.session==="A"||w.session==="B").slice(-1)[0];
 return {type:"train",session:last&&last.d===(d||today())?last.session:(n%2===0?"A":"B")};
}
function lastPerf(key,before){
 for(let i=S.workouts.length-1;i>=0;i--){const w=S.workouts[i];if(before&&w.id===before)continue;const e=w.ex.find(x=>x.key===key);if(e&&e.sets.length)return e}
 return null;
}
function incFor(slot,vi){const eq=SLOTS[slot].v[vi].eq;if(eq.includes("bb")||eq.includes("machine")||eq.includes("cable"))return 2.5;if(eq.includes("db"))return SLOTS[slot].main?2:1;return 0}
function setsTxt(e){return e.sets.map(s=>(s.w?s.w+"×":"")+s.r).join(", ")}
function recommend(slot,vi){
 const pr=prescription(slot),key=slot+":"+vi,last=lastPerf(key);
 if(!last)return {txt:t("recFirst",{r:pr.rir}),w:""};
 const sets=last.sets.filter(s=>s.r>0);if(!sets.length)return {txt:t("recFirst",{r:pr.rir}),w:""};
 const w=Math.max(...sets.map(s=>num(s.w,0))),minR=Math.min(...sets.map(s=>s.r));
 const rirs=sets.map(s=>s.rir).filter(x=>x!==""&&x!=null).map(Number);
 const minRir=rirs.length?Math.min(...rirs):pr.rirMin;
 const inc=incFor(slot,vi),lastT=setsTxt(last);
 let txt,nw=w||"";
 const fail=rirs.some(r=>r===0)?" "+t("failWarn"):"";
 if(minR>=pr.b&&minRir>=pr.rirMin){
  if(inc&&w>0){nw=r1(w+inc);txt=t("recUp",{last:lastT,b:pr.b,w:nw,a:pr.a})}else txt=t("recUpBw",{last:lastT,b:pr.b});
 } else if(minR>=pr.b){txt=t("recRir",{last:lastT,w:w||0,b:pr.b,r:pr.rirMin})}
 else if(minR<pr.a){txt=t("recDown",{last:lastT,a:pr.a})}
 else if(S.phase==="fb3"&&weekNo()<=2&&minRir<2){txt=t("recHold")}
 else txt=t("recReps",{last:lastT,w:w||0});
 return {txt:txt+fail,w:nw};
}
function newDraft(session,d){
 return {id:uid(),d:d||today(),session,ex:SESS[session].s.map(slot=>{
  const vi=variantIdx(slot),pr=prescription(slot),rec=recommend(slot,vi);
  return {key:slot+":"+vi,slot,vi,sets:Array.from({length:pr.sets},()=>({w:rec.w,r:"",rir:"",rest:pr.rest}))};
 })};
}

  <div class="row"><input type="date" id="wD" value="${today()}" max="${today()}"><input type="number" step="0.1" inputmode="decimal" id="wV" placeholder="${r1(cw)}"> <button class="btn" data-act="addWeight">${t("save")}</button></div>
  <p class="small muted">${t("morningNote")}</p>${chartSvg()}</div>
 <div class="card"><h2>${t("review")}</h2>
  <p>${t("rate")}: <b class="ltr">${tr?(tr.rate>=0?"+":"")+tr.rate.toFixed(2)+" "+t("perWeek"):"—"}</b> <span class="small muted">(${t("target")} ${g.min}–${g.max})</span></p>
  <p class="small">${rs.over?t("reviewOver",{d:rs.d}):rs.due?t("reviewDue",{d:rs.d}):t("reviewNot",{d:rs.next})}</p>
  ${tr?"":`<p class="small muted">${t("reviewNeed")}</p>`}
  <button class="btn sm" data-act="review" ${rs.due&&tr?"":"disabled"}>${t("runReview")}</button></div>
 <div class="card"><h2>${t("weeklyAvgs")}</h2>${wa.length?`<div class="tw"><table><tr><th>${t("week")}</th><th>${t("avg")}</th><th>${t("n")}</th><th>${t("change")}</th></tr>
  ${wa.slice().reverse().map((x,i,arr)=>{const prev=arr[i+1];const ch=prev?x.avg-prev.avg:null;return `<tr><td>${fmtD(x.wk)}</td><td>${r1(x.avg)}</td><td>${x.n}</td><td class="ltr">${ch==null?"—":(ch>=0?"+":"")+ch.toFixed(2)}</td></tr>`}).join("")}</table></div>`:`<p class="muted small">${t("noData")}</p>`}</div>
 <div class="card"><h2>${t("milestones")}</h2>
  <p class="small muted">${t("msEta",{a:g.min,b:g.max,x:Math.max(0,Math.ceil(total/g.max)),y:Math.max(0,Math.ceil(total/g.min))})}</p>
  <label class="f" style="max-width:160px">${t("msCount")}<input type="number" min="1" max="20" id="msN" value="${S.msCount}"></label>
  <div class="ms"><span class="dot done"></span><span class="ltr">${S.profile.startWeight} kg</span><span class="small muted">${t("msBmi",{b:r1(bmi(S.profile.startWeight,S.profile.height))})}</span></div>
  ${ms.map(m=>`<div class="ms"><span class="dot ${cw>=m.w?"done":""}"></span><b class="ltr">${m.w} kg</b><span class="small muted">${t("msBmi",{b:r1(m.bmi)})}</span>${m.bmi>=18.5&&m.bmi<25?`<span class="badge ver">${t("healthy")}</span>`:""}<span class="small muted" style="margin-inline-start:auto">+${r1(m.w-S.profile.startWeight)}</span></div>`).join("")}
 </div>
 <div class="card"><h2>${t("history")}</h2><div class="tw"><table><tr><th>${t("date")}</th><th>${t("weight")}</th><th></th></tr>
  ${sortedWeights().reverse().slice(0,60).map(e=>`<tr><td>${fmtD(e.d)} <span class="small muted">${e.d}</span></td><td>${e.w}</td><td><button class="btn alt sm" data-act="delWeight" data-d="${e.d}">✕</button></td></tr>`).join("")}</table></div></div>`;
}
function viewTrain(){
 const dr=S.draft,plan=todayPlan(),recent=S.recovery.slice(-5).reverse();
 const sessOpts=(S.phase==="split5"?["push","pull","legs","upper","lower"]:["A","B"]).concat(S.phase==="split5"?["A","B"]:["push","pull","legs","upper","lower"]);
 let wkplan=[1,2,3,4,5,6,0].map(dw=>{const lbl=t("days")[dw];let x;
  if(S.phase==="split5"){x=WEEK_SPLIT[dw]?t(SESS[WEEK_SPLIT[dw]].k):t("rest")}
  else{x=WEEK_FB3[dw]==="train"?"A/B":WEEK_FB3[dw]==="walk"?t("walk"):t("rest")}
  return `<tr><td>${lbl}</td><td>${x}</td></tr>`}).join("");
 let html=`<div class="card"><h2>${t("planWeek")} — ${phaseName(S.phase)}</h2>
  <p class="small">${t("weekN",{n:weekNo()})} · ${S.phase==="split5"?t("split5Detail"):t("fb3Detail")}</p>
  ${S.phase==="fb3"&&weekNo()<=2?`<p class="small">${t("wk1")}<br>${t("wk2")}</p>`:""}
  <p class="small"><b>${t("noFailure")}</b> ${S.phase==="fb3"?t("propose5"):""}</p>
  <div class="tw"><table>${wkplan}</table></div></div>`;
 html+=`<div class="card"><h2>${t("recovery")}</h2><p class="small muted">${t("recNeed5")}</p>
  <div class="fgrid"><label class="f">${t("sleep")}<input type="number" step="0.5" id="rS" value="7"></label>
  <label class="f">${t("soreness")}<input type="number" min="1" max="5" id="rSo" value="2"></label>
  <label class="f">${t("energy")}<input type="number" min="1" max="5" id="rE" value="3"></label></div>
  <button class="btn sm" style="margin-top:8px" data-act="saveRec">${t("save")}</button>
  ${recent.length?`<div class="tw"><table>${recent.map(r=>`<tr><td>${fmtD(r.d)}</td><td>${r.sleep}h</td><td>${r.soreness}</td><td>${r.energy}</td><td><span class="badge ${recOk(r)?"ver":"est"}">${recOk(r)?t("recOk"):t("recBad")}</span></td></tr>`).join("")}</table></div>`:""}</div>`;
 if(!dr){
  html+=`<div class="card"><h2>${t("logWorkout")}</h2><div class="row">
   <select id="sSel">${sessOpts.map(s=>`<option value="${s}" ${plan.type==="train"&&plan.session===s?"selected":""}>${t(SESS[s].k)}</option>`).join("")}</select>
   <input type="date" id="sD" value="${today()}"><button class="btn" data-act="startSess">${t("start")}</button></div></div>`;
 } else {
  html+=`<div class="card"><h2>${t(SESS[dr.session].k)} · ${fmtD(dr.d)}</h2><p class="small muted">${t("noFailure")}</p>
  ${dr.ex.map((e,ei)=>{const v=SLOTS[e.slot].v[e.vi],pr=prescription(e.slot),rec=recommend(e.slot,e.vi);
   return `<div class="ex"><h4>${esc(L(v))}</h4><div class="small muted">${t("presc",{s:pr.sets,a:pr.a,b:pr.b,r:pr.rir,t:pr.rest})}</div>
   <div class="rec">${esc(rec.txt)}</div>
   <div class="tw"><table class="sets"><tr><th>#</th><th>${t("kg")}</th><th>${SLOTS[e.slot].bw?"s":t("reps")}</th><th>${t("rir")}</th><th>${t("restS")}</th><th></th></tr>
   ${e.sets.map((s,si)=>`<tr><td>${si+1}</td>
    <td><input type="number" step="0.5" inputmode="decimal" data-set="${ei}.${si}.w" value="${s.w}"></td>
    <td><input type="number" step="1" inputmode="numeric" data-set="${ei}.${si}.r" value="${s.r}"></td>
    <td><input type="number" step="1" min="0" max="5" inputmode="numeric" data-set="${ei}.${si}.rir" value="${s.rir}"></td>
    <td><input type="number" step="15" inputmode="numeric" data-set="${ei}.${si}.rest" value="${s.rest}"></td>
    <td><button class="btn alt sm" data-act="timer" data-sec="${s.rest}">⏱</button></td></tr>`).join("")}
   </table></div><button class="btn alt sm" data-act="addSet" data-ei="${ei}">${t("addSet")}</button></div>`}).join("")}
  <div class="row"><button class="btn ok" data-act="saveSess">${t("saveWorkout")}</button><button class="btn alt" data-act="discardSess">${t("discard")}</button></div></div>`;
 }
 const ws=S.workouts.slice().reverse().slice(0,30);
 html+=`<div class="card"><h2>${t("workouts")}</h2>${ws.length?ws.map(w=>{const vol=w.ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+num(s.w,0)*(s.r||0),0),0);
  return `<details><summary>${fmtD(w.d)} — ${t(SESS[w.session].k)} <span class="small muted">· ${t("volume")} ${r0(vol)} kg</span></summary>
  <div class="small">${w.ex.map(e=>`<div>${esc(L(SLOTS[e.slot].v[e.vi]))}: <span class="ltr">${esc(setsTxt(e))}</span>${e.sets.some(s=>s.rir!=="")?` <span class="muted">(RIR ${e.sets.map(s=>s.rir).join("/")})</span>`:""}</div>`).join("")}
  <button class="btn alt sm" data-act="delWorkout" data-id="${w.id}">${t("del")}</button></div></details>`}).join("<hr>"):`<p class="muted small">${t("noWorkouts")}</p>`}</div>`;
 return html;
}
function viewProfile(){
 const p=S.profile,e=estimates(),cw=curWeight(),b=bmi(cw,p.height);
 return safetyCard()+`<div class="card"><h2>${t("profile")}</h2>
  <div class="fgrid">
   <label class="f">${t("name")}<input id="pName" value="${esc(p.name)}"></label>
   <label class="f">${t("age")}<input type="number" id="pAge" value="${p.age}"></label>
   <label class="f">${t("sex")}<select id="pSex"><option value="m" ${p.sex==="m"?"selected":""}>${t("male")}</option><option value="f" ${p.sex==="f"?"selected":""}>${t("female")}</option></select></label>
   <label class="f">${t("height")}<input type="number" id="pH" value="${p.height}"></label>
   <label class="f">${t("startW")}<input type="number" step="0.1" id="pSW" value="${p.startWeight}"></label>
   <label class="f">${t("curW")}<input type="number" step="0.1" id="pW" value="${r1(cw)}"></label>
   <label class="f">${t("targetW")}<input type="number" step="0.5" id="pT" value="${p.target}"></label>
   <label class="f">${t("activity")}<select id="pAct">${["sed","light","mod"].map(a=>`<option value="${a}" ${p.activity===a?"selected":""}>${t({sed:"actSed",light:"actLight",mod:"actMod"}[a])}</option>`).join("")}</select></label>
   <label class="f">${t("gym")}<select id="pGym">${["limited","full","home"].map(a=>`<option value="${a}" ${p.gym===a?"selected":""}>${t({limited:"gymLimited",full:"gymFull",home:"gymHome"}[a])}</option>`).join("")}</select></label>
   <label class="f">${t("startDate")}<input type="date" id="pSD" value="${p.startDate}"></label>
   <label class="f">${t("gainRange")} — ${t("min")}<input type="number" step="0.01" id="gMin" value="${S.gain.min}"></label>
   <label class="f">${t("gainRange")} — ${t("max")}<input type="number" step="0.01" id="gMax" value="${S.gain.max}"></label>
  </div>
  <label class="f" style="margin-top:10px">${t("experience")}<input id="pExp" value="${esc(p.experience)}"></label>
  <button class="btn" style="margin-top:10px" data-act="saveProfile">${t("save")}</button></div>
 <div class="card"><h2>${t("estimates")}</h2><div class="grid">
  <div class="kpi"><span>${t("bmiLbl")}</span><b>${r1(b)}</b></div>
  <div class="kpi"><span>${t("bmr")}</span><b class="ltr">${r0(e.bmr)} kcal</b></div>
  <div class="kpi"><span>${t("sedMaint")}</span><b class="ltr">≈ ${r10(e.base)} kcal</b></div>
  <div class="kpi"><span>${t("gymMaint")}</span><b class="ltr">${r10(e.gymLo)}–${r10(e.gymHi)} kcal</b></div>
 </div><p class="small muted">${t("estNote2")} ${t("targetsNote")}</p></div>
 <div class="card"><h2>${t("equipment")}</h2><p class="small muted">${t("eqNote")}</p><div class="row">
  ${EQUIP.map(k=>`<label class="badge ${S.equip[k]?"on":""}" style="font-size:13px;padding:5px 10px;cursor:pointer"><input type="checkbox" data-eq="${k}" ${S.equip[k]?"checked":""}> ${t("eq_"+k)}</label>`).join("")}</div></div>
 <div class="card"><h2>${t("data")}</h2><p class="small muted">${t("storageOk")}</p><div class="row">
  <button class="btn alt" data-act="export">${t("export")}</button>
  <label class="btn alt">${t("import")}<input type="file" id="impF" accept="application/json,.json" hidden></label></div></div>
 <div class="card"><h2>${t("changeLog")}</h2><div class="small">${S.log.slice().reverse().slice(0,40).map(l=>`<div><span class="muted">${l.d}</span> — ${esc(l.text==="init"?"FIT COACH PRO":l.text)}</div>`).join("")}</div></div>`;
}

/* ---------- render ---------- */
const TABS=[["today","tabToday","⌂"],["food","tabFood","🍽"],["weight","tabWeight","⚖"],["train","tabTrain","🏋"],["profile","tabProfile","☺"]];
function render(){
 const np=S.proposals.length;checkPhaseProposal();if(S.proposals.length!==np)save();
 document.documentElement.lang=LANG;document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
 $("#hsub").textContent=t("sub");$("#langBtn").textContent=LANG==="ar"?"FR":"عربي";$("#installBtn").textContent=t("install");
 $("#nav").innerHTML=TABS.map(([k,l,i])=>`<button class="${TAB===k?"on":""}" data-tab="${k}"><span class="i">${i}</span>${t(l)}</button>`).join("");
 const pend=S.proposals.filter(p=>p.status==="pending").length;
 if(pend)$("#nav").querySelector('[data-tab="today"]').insertAdjacentHTML("beforeend",`<span class="badge on" style="font-size:10px">${pend}</span>`);
 $("#app").innerHTML={today:viewToday,food:viewFood,weight:viewWeight,train:viewTrain,profile:viewProfile}[TAB]();
 if(TAB==="food")syncFoodInfo("serv");
}
function syncFoodInfo(from){
 const f=food($("#fSel").value);if(!f)return;
 if(from==="serv")$("#fG").value=r0(num($("#fServ").value,1)*f.sg);
 else $("#fServ").value=r1(num($("#fG").value,0)/f.sg);
 const g=num($("#fG").value,0),m=g/100;
 $("#fInfo").textContent=`${L(f.sl)} = ${f.sg} g · ${r0(f.k*m)} kcal · P ${r1(f.p*m)} · C ${r1(f.c*m)} · F ${r1(f.f*m)}${f.q==="est"?" · "+t("estimated"):""}`;
}

/* ---------- actions ---------- */
function setWeight(d,w){
 if(!(w>20&&w<300)||d>today()){toast(t("badWeight"));return false}
 S.weights=S.weights.filter(e=>e.d!==d);S.weights.push({d,w:r1(w)});
 S.profile.weight=curWeight();save();return true;
}
document.addEventListener("click",ev=>{
 const tb=ev.target.closest("[data-tab]");if(tb){TAB=tb.dataset.tab;try{sessionStorage.setItem("fcp-tab",TAB)}catch(e){}render();scrollTo(0,0);return}
 const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 switch(a){
  case "accept":acceptProposal(id);break;
  case "reject":rejectProposal(id);break;
  case "review":runReview();break;
  case "quickWeight":if(setWeight(today(),num($("#qW").value,0))){toast(t("saved"));render()}break;
  case "addWeight":if(setWeight($("#wD").value||today(),num($("#wV").value,0))){toast(t("saved"));render()}break;
  case "delWeight":if(confirm(t("confirmDel"))){S.weights=S.weights.filter(e=>e.d!==b.dataset.d);S.profile.weight=curWeight();save();render()}break;
  case "addEntry":{const g=num($("#fG").value,0);if(g<=0)return;const d=UI.foodDay;(S.diary[d]=S.diary[d]||[]).push({id:uid(),food:$("#fSel").value,g});save();const keep=$("#fSel").value;render();$("#fSel").value=keep;syncFoodInfo("serv");toast(t("saved"));break}
  case "delEntry":{const d=UI.foodDay;S.diary[d]=(S.diary[d]||[]).filter(e=>e.id!==id);save();render();break}
  case "saveTargets":{const n={kcal:r0(num($("#tK").value,S.targets.kcal)),p:r0(num($("#tP").value,S.targets.p)),c:r0(num($("#tC").value,S.targets.c)),f:r0(num($("#tF").value,S.targets.f))};
   if(confirm(t("confirmTargets"))){S.targets=n;logChange(t("logTargets",{k:n.kcal}));save();toast(t("saved"));render()}break}
  case "editFood":UI.editFood=id;render();document.getElementById("nfAr").scrollIntoView({block:"center"});break;
  case "cancelFood":UI.editFood=null;render();break;
  case "delFood":if(confirm(t("confirmDel"))){S.foods=S.foods.filter(f=>f.id!==id);UI.editFood=null;save();render()}break;
  case "resetFoods":if(confirm(t("confirmResetFoods"))){const custom=S.foods.filter(f=>!DEF_FOODS.some(d=>d.id===f.id));S.foods=DEF_FOODS.map(f=>Object.assign({},f)).concat(custom);save();render()}break;
  case "saveFood":{const ar=$("#nfAr").value.trim(),fr=$("#nfFr").value.trim();if(!ar&&!fr)return;
   const vals={ar:ar||fr,fr:fr||ar,k:num($("#nfK").value,0),p:num($("#nfP").value,0),c:num($("#nfC").value,0),f:num($("#nfF").value,0),sg:Math.max(1,num($("#nfS").value,100))};
   const sl=$("#nfSL").value.trim();
   if(UI.editFood){const f=food(UI.editFood);const changedVals=["k","p","c","f"].some(k=>f[k]!==vals[k]);Object.assign(f,vals);f.sl=Object.assign({},f.sl||{},{[LANG]:sl});
    if(changedVals){f.q="est";f.src=(f.src&&f.src!=="—"?f.src+" · ":"")+(LANG==="ar"?"معدّل":"modifié")}}
   else S.foods.push(Object.assign({id:"u_"+uid(),sl:{ar:sl,fr:sl},src:LANG==="ar"?"مُدخل يدويًا":"saisi manuellement",q:"est"},vals));
   UI.editFood=null;save();toast(t("saved"));render();break}
  case "startToday":{const p=todayPlan();if(p.type==="train"){if(!S.draft)S.draft=newDraft(p.session);save();TAB="train";render()}break}
  case "startSess":S.draft=newDraft($("#sSel").value,$("#sD").value||today());save();render();break;
  case "addSet":{const e=S.draft.ex[+b.dataset.ei],l=e.sets[e.sets.length-1]||{w:"",rest:prescription(e.slot).rest};e.sets.push({w:l.w,r:"",rir:"",rest:l.rest});save();render();break}
  case "timer":startTimer(num(b.dataset.sec,90));break;
  case "saveSess":{const d=S.draft;d.ex.forEach(e=>e.sets=e.sets.filter(s=>num(s.r,0)>0).map(s=>({w:s.w===""?0:num(s.w,0),r:num(s.r,0),rir:s.rir===""?"":num(s.rir,""),rest:num(s.rest,0)})));
   d.ex=d.ex.filter(e=>e.sets.length);if(!d.ex.length){toast(t("noWorkouts"));return}
   S.workouts.push(d);S.draft=null;save();toast(t("saved"));render();break}
  case "discardSess":if(confirm(t("confirmDel"))){S.draft=null;save();render()}break;
  case "delWorkout":if(confirm(t("confirmDel"))){S.workouts=S.workouts.filter(w=>w.id!==id);save();render()}break;
  case "saveRec":{S.recovery.push({d:today(),sleep:num($("#rS").value,7),soreness:num($("#rSo").value,2),energy:num($("#rE").value,3)});save();toast(t("saved"));render();break}
  case "saveProfile":{if(!confirm(t("confirmProfile")))return;const p=S.profile;
   p.name=$("#pName").value.trim()||p.name;p.age=num($("#pAge").value,p.age);p.sex=$("#pSex").value;p.height=num($("#pH").value,p.height);
   p.startWeight=num($("#pSW").value,p.startWeight);p.target=num($("#pT").value,p.target);p.activity=$("#pAct").value;p.gym=$("#pGym").value;
   p.startDate=$("#pSD").value||p.startDate;p.experience=$("#pExp").value;
   const gmin=num($("#gMin").value,S.gain.min),gmax=num($("#gMax").value,S.gain.max);if(gmin>0&&gmax>gmin)S.gain={min:gmin,max:gmax};
   const nw=num($("#pW").value,0);if(nw&&Math.abs(nw-curWeight())>=0.05)setWeight(today(),nw);
   logChange(t("logProfile"));save();toast(t("saved"));render();break}
  case "export":{const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="fit-coach-pro-"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);break}
 }
});
document.addEventListener("input",ev=>{
 const el=ev.target;
 if(el.dataset.set&&S.draft){const [ei,si,k]=el.dataset.set.split(".");S.draft.ex[+ei].sets[+si][k]=el.value;
  if(k==="rest"){const btn=el.closest("tr").querySelector('[data-act="timer"]');if(btn)btn.dataset.sec=el.value}save();return}
 if(el.id==="fServ")syncFoodInfo("serv");
 if(el.id==="fG")syncFoodInfo("g");
});
document.addEventListener("change",ev=>{
 const el=ev.target;
 if(el.id==="fSel")syncFoodInfo("serv");
 if(el.id==="fDay"){UI.foodDay=el.value||today();render()}
 if(el.id==="msN"){S.msCount=Math.max(1,Math.min(20,num(el.value,6)|0));save();render()}
 if(el.dataset.eq){S.equip[el.dataset.eq]=el.checked;save();render()}
 if(el.id==="impF"&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||!s.v||!s.profile)throw 0;
   if(confirm(t("confirmImport"))){S=migrate(s);LANG=S.lang||LANG;save();render();toast(t("saved"))}}catch(e){toast(t("importErr"))}};r.readAsText(el.files[0])}
});
$("#langBtn").onclick=()=>{LANG=LANG==="ar"?"fr":"ar";S.lang=LANG;save();render()};
$("#themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
 const n=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("fcp-theme",n)}catch(e){}};

/* ---------- PWA ---------- */
let deferred=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;$("#installBtn").hidden=true};
addEventListener("appinstalled",()=>{$("#installBtn").hidden=true});
if("serviceWorker" in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

save();render();
</script>
</body>
</html>
